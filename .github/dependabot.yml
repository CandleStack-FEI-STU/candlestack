# Weekly update pull requests. Minor and patch updates of an ecosystem come together in one
# pull request; each major update comes alone. A release waits 7 days first, so a compromised
# one is likely pulled before it reaches us.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # uv is one release line everywhere (required-version in backend/pyproject.toml, the
      # uv_build bound, the uv image in the Dockerfile); a new line is adopted by hand.
      - dependency-name: uv-build
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The workflows and the composite actions in .github/actions.
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The backend is on Python 3.13 (requires-python); moving on is a deliberate change.
      - dependency-name: python
        versions: [">=3.14"]
      # See uv-build above.
      - dependency-name: astral-sh/uv
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /infra/agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # One Python line in the repo: the agent follows the backend's 3.13.
      - dependency-name: python
        versions: [">=3.14"]

  # The long-running images on the VM (Redis, the edge Caddy, the Docker socket proxy) are
  # pinned in these compose files and change only through these pull requests.
  - package-ecosystem: docker-compose
    directories: [/infra/env, /infra/edge, /infra/agent]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-compose:
        patterns: ["*"]
        update-types: [minor, patch]
