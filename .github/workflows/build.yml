name: Build image

on:
  workflow_call:
    inputs:
      name:
        description: Image name under ghcr.io/candlestack-fei-stu/candlestack/
        required: true
        type: string
      context:
        description: Docker build context
        required: true
        type: string
      tag:
        description: Image tag to push
        required: true
        type: string
      commit:
        description: Commit shown by the app
        required: true
        type: string
    outputs:
      image:
        description: Pushed image as name@digest
        value: ${{ jobs.build.outputs.image }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    env:
      IMAGE: ghcr.io/candlestack-fei-stu/candlestack/${{ inputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          build-args: APP_COMMIT=${{ inputs.commit }}
          cache-from: type=gha,scope=${{ inputs.name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.name }}

      - id: ref
        run: echo "image=$IMAGE@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
