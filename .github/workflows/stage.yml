name: Stage

# Every push to main is built once and deployed to stage.candlestack.tech,
# together with the edge proxy and the server agent (vm.candlestack.tech, read by ops).
# The same backend and frontend images are later promoted to prod by a v* tag (release.yml).
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: stage
  cancel-in-progress: false

jobs:
  no-ai-signs:
    uses: CandleStack-FEI-STU/.github/.github/workflows/no-ai-signs.yml@main
    permissions:
      contents: read

  build-backend:
    needs: no-ai-signs
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: backend
      context: backend
      tag: sha-${{ github.sha }}
      commit: ${{ github.sha }}

  build-frontend:
    needs: no-ai-signs
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: frontend
      context: frontend
      tag: sha-${{ github.sha }}
      commit: ${{ github.sha }}

  build-agent:
    needs: no-ai-signs
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: agent
      context: infra/agent
      tag: sha-${{ github.sha }}
      commit: ${{ github.sha }}

  deploy:
    needs: [build-backend, build-frontend, build-agent]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://stage.candlestack.tech
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # First: it also updates the VM's checkout, so the steps below run the new deploy script.
      - name: Update the edge proxy
        uses: ./.github/actions/deploy
        with:
          command: edge
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # The edge Caddy routes prod too, and the smoke test below checks only stage. prod is
      # public: checked without the Access token, as anyone reaches it.
      - name: Check prod behind the updated edge
        run: |
          # check <url> <text>: HTTP 200 with the text in the body, retried for about 30 s.
          check() {
            local status body
            for _ in $(seq 1 10); do
              rm -f "$RUNNER_TEMP/prod"
              status=$(curl -sS --max-time 10 -o "$RUNNER_TEMP/prod" -w '%{http_code}' "$1" || true)
              body=$(cat "$RUNNER_TEMP/prod" 2>/dev/null || true)
              if [[ $status == 200 && $body == *"$2"* ]]; then
                echo "ok    $1"
                return 0
              fi
              sleep 3
            done
            echo "::error::$1 did not answer 200 with '$2' after the edge update (last: HTTP ${status:-none} ${body:0:300})"
            return 1
          }
          check https://app.candlestack.tech/api/health '"status":"ok"'
          check https://app.candlestack.tech/ '<html'

      - name: Deploy the server agent
        uses: ./.github/actions/deploy
        with:
          command: agent ${{ needs.build-agent.outputs.image }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          health-url: https://vm.candlestack.tech/api/health
          health-expect: '"status":"ok"'

      - name: Deploy stage
        uses: ./.github/actions/deploy
        with:
          command: >-
            up stage main-${{ github.sha }}
            ${{ needs.build-backend.outputs.image }} ${{ needs.build-frontend.outputs.image }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          env-secrets: |
            ALPACA_KEY_ID=${{ secrets.ALPACA_KEY_ID }}
            ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}
          health-url: https://stage.candlestack.tech/api/health
          health-expect: ${{ github.sha }}

      - name: Smoke test
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: .github/scripts/smoke.sh https://stage.candlestack.tech
