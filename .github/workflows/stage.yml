name: Stage

# Every push to main is built once and deployed to stage.candlestack.tech,
# together with the edge proxy and the server agent (vm.candlestack.tech, read by ops).
# The same backend and frontend images are later promoted to prod by a v* tag (release.yml).
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: stage
  cancel-in-progress: false

jobs:
  no-ai-signs:
    uses: CandleStack-FEI-STU/.github/.github/workflows/no-ai-signs.yml@main
    permissions:
      contents: read

  build-backend:
    needs: no-ai-signs
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: backend
      context: backend
      tag: sha-${{ github.sha }}
      commit: ${{ github.sha }}

  build-frontend:
    needs: no-ai-signs
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: frontend
      context: frontend
      tag: sha-${{ github.sha }}
      commit: ${{ github.sha }}

  build-agent:
    needs: no-ai-signs
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: agent
      context: infra/agent
      tag: sha-${{ github.sha }}
      commit: ${{ github.sha }}

  deploy:
    needs: [build-backend, build-frontend, build-agent]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://stage.candlestack.tech
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # First: it also updates the VM's checkout, so the steps below run the new deploy script.
      - name: Update the edge proxy
        uses: ./.github/actions/deploy
        with:
          command: edge
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Deploy the server agent
        uses: ./.github/actions/deploy
        with:
          command: agent ${{ needs.build-agent.outputs.image }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          health-url: https://vm.candlestack.tech/api/health
          health-expect: '"status":"ok"'

      - name: Deploy stage
        uses: ./.github/actions/deploy
        with:
          command: >-
            up stage main-${{ github.sha }}
            ${{ needs.build-backend.outputs.image }} ${{ needs.build-frontend.outputs.image }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          env-secrets: |
            ALPACA_KEY_ID=${{ secrets.ALPACA_KEY_ID }}
            ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}
          health-url: https://stage.candlestack.tech/api/health
          health-expect: ${{ github.sha }}

      - name: Smoke test
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: .github/scripts/smoke.sh https://stage.candlestack.tech
