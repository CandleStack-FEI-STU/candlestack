name: Stage

# Every push to main is built once and deployed to stage.candlestack.tech.
# The same image is later promoted to prod by a v* tag (release.yml).
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: stage
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: sha-${{ github.sha }}
      commit: ${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://stage.candlestack.tech
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Update the edge proxy
        uses: ./.github/actions/deploy
        with:
          command: edge
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Deploy stage
        uses: ./.github/actions/deploy
        with:
          command: up stage ${{ needs.build.outputs.image }} main-${{ github.sha }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          health-url: https://stage.candlestack.tech/api/health
          health-expect: ${{ github.sha }}
