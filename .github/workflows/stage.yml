name: Stage

# Every push to main is built once and deployed to stage.candlestack.tech,
# together with the edge proxy and the ops page (ops.candlestack.tech).
# The same image is later promoted to prod by a v* tag (release.yml).
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: stage
  cancel-in-progress: false

jobs:
  no-ai-signs:
    uses: CandleStack-FEI-STU/.github/.github/workflows/no-ai-signs.yml@main
    permissions:
      contents: read

  build:
    needs: no-ai-signs
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: sha-${{ github.sha }}
      commit: ${{ github.sha }}

  build-ops:
    needs: no-ai-signs
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: ops
      context: infra/ops
      tag: sha-${{ github.sha }}
      commit: ${{ github.sha }}

  deploy:
    needs: [build, build-ops]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://stage.candlestack.tech
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Update the edge proxy
        uses: ./.github/actions/deploy
        with:
          command: edge
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Deploy the ops page
        uses: ./.github/actions/deploy
        with:
          command: ops ${{ needs.build-ops.outputs.image }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          health-url: https://ops.candlestack.tech/api/health
          health-expect: '"status":"ok"'

      - name: Deploy stage
        uses: ./.github/actions/deploy
        with:
          command: up stage ${{ needs.build.outputs.image }} main-${{ github.sha }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          health-url: https://stage.candlestack.tech/api/health
          health-expect: ${{ github.sha }}
