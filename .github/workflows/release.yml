name: Release

# A v* tag on a commit of main promotes the backend and frontend images that stage already
# runs for that commit to prod (app.candlestack.tech). Nothing is rebuilt. The production
# environment requires the tech lead's approval before the deploy starts. The images get the
# version tag in the registry only after prod runs them; the job that deploys, and the token it
# gives the VM, can only read packages.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/candlestack-fei-stu/candlestack

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://app.candlestack.tech
    permissions:
      contents: read
      packages: read
    outputs:
      backend: ${{ steps.images.outputs.backend }}
      frontend: ${{ steps.images.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the stage images of this commit
        id: images
        run: |
          # Both images must exist before either is deployed.
          for name in backend frontend; do
            if ! manifest=$(docker buildx imagetools inspect "$REGISTRY/$name:sha-$GITHUB_SHA" --format '{{json .Manifest}}'); then
              echo "::error::No $name image for $GITHUB_SHA. Tag a commit of main that has been deployed to stage."
              exit 1
            fi
            echo "$name=$REGISTRY/$name@$(jq -r .digest <<<"$manifest")" >> "$GITHUB_OUTPUT"
          done

      - name: Deploy prod
        uses: ./.github/actions/deploy
        with:
          command: >-
            up prod ${{ github.ref_name }}
            ${{ steps.images.outputs.backend }} ${{ steps.images.outputs.frontend }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          env-secrets: |
            ALPACA_KEY_ID=${{ secrets.ALPACA_KEY_ID }}
            ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}
          health-url: https://app.candlestack.tech/api/health
          health-expect: '"version":"${{ github.ref_name }}"'

      # prod is public: no Access token, so this also checks that anyone can reach it.
      - name: Smoke test
        run: .github/scripts/smoke.sh https://app.candlestack.tech

  # The only job that writes packages: it has no environment secrets and talks to no server.
  tag:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the deployed images with the version
        env:
          BACKEND: ${{ needs.deploy.outputs.backend }}
          FRONTEND: ${{ needs.deploy.outputs.frontend }}
        run: |
          for image in "$BACKEND" "$FRONTEND"; do
            docker buildx imagetools create --tag "${image%@*}:$GITHUB_REF_NAME" "$image"
          done
