name: Preview

# Adding the "preview" label to a pull request deploys its current commit to
# pr-<N>-preview.candlestack.tech. The server runs one preview at a time: when another pull
# request holds it, the label comes off again and a comment says until when. A preview lives
# until a new commit arrives (it goes, with the label; add the label again to deploy that
# commit), the label is removed, the pull request is closed or it has run for PREVIEW_HOURS
# (preview-cleanup.yml). Pull requests from forks never deploy.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]

permissions: {}

env:
  # How long a preview lives; the same in preview-cleanup.yml.
  PREVIEW_HOURS: 6

# Runs that deploy or remove the preview share one group per pull request, and a newer one
# cancels the one in progress (a new commit stops a deploy). Every other run (a label other
# than "preview", a pull request without it) does nothing and gets a group of its own.
concurrency:
  group: >-
    preview-${{ github.event.pull_request.number }}-${{
    (github.event.pull_request.head.repo.full_name == github.repository &&
     ((contains(github.event.pull_request.labels.*.name, 'preview') &&
       (github.event.action == 'opened' || github.event.action == 'reopened' ||
        github.event.action == 'synchronize' || github.event.action == 'closed' ||
        (github.event.action == 'labeled' && github.event.label.name == 'preview'))) ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview')))
    && 'env' || github.run_id }}
  cancel-in-progress: true

jobs:
  no-ai-signs:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action == 'opened' || github.event.action == 'reopened' ||
       (github.event.action == 'labeled' && github.event.label.name == 'preview'))
    uses: CandleStack-FEI-STU/.github/.github/workflows/no-ai-signs.yml@main
    permissions:
      contents: read

  build-backend:
    needs: no-ai-signs
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: backend
      context: backend
      tag: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      commit: ${{ github.event.pull_request.head.sha }}

  build-frontend:
    needs: no-ai-signs
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      name: frontend
      context: frontend
      tag: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      commit: ${{ github.event.pull_request.head.sha }}

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}-preview.candlestack.tech
    # Deploys of different pull requests take turns, so each finds the slot as the one before
    # left it.
    concurrency:
      group: preview-slot
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: List the running previews
        id: previews
        uses: ./.github/actions/deploy
        with:
          command: previews
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # Free, or held by this pull request already. When another one holds it, the label comes
      # off, a comment says until when (about PREVIEW_HOURS after that preview was deployed) and
      # the job fails, so GitHub shows no deployment that does not exist.
      - name: Check the preview slot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PREVIEWS: ${{ steps.previews.outputs.output }}
        run: |
          taken=$(awk -v own="pr-$PR" '$1 ~ /^pr-[0-9]+$/ && $1 != own' <<<"$PREVIEWS" | head -n 1)
          if [[ -z $taken ]]; then
            exit 0
          fi
          read -r holder deployed <<<"$taken"
          until=$((deployed + PREVIEW_HOURS * 3600))
          now=$(date +%s)
          if ((until <= now)); then
            until=$((now + 3600)) # past its time: the hourly cleanup removes it
          fi
          at=$(TZ=Europe/Bratislava date -d "@$until" '+%-d %b %H:%M')
          gh pr edit "$PR" --remove-label preview
          gh pr comment "$PR" --body "Preview not deployed: the only preview slot is taken by #${holder#pr-} until about $at (Bratislava time). Add the \`preview\` label again once it is free."
          echo "::error::The preview slot is taken by $holder until about $at; the label is removed."
          exit 1

      - name: Deploy the preview
        uses: ./.github/actions/deploy
        with:
          command: >-
            up pr-${{ github.event.pull_request.number }}
            pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
            ${{ needs.build-backend.outputs.image }} ${{ needs.build-frontend.outputs.image }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          env-secrets: |
            ALPACA_KEY_ID=${{ secrets.ALPACA_KEY_ID }}
            ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY }}
          health-url: https://pr-${{ github.event.pull_request.number }}-preview.candlestack.tech/api/health
          health-expect: ${{ github.event.pull_request.head.sha }}

      - name: Smoke test
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: .github/scripts/smoke.sh https://pr-${{ github.event.pull_request.number }}-preview.candlestack.tech

  remove:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((contains(github.event.pull_request.labels.*.name, 'preview') &&
        (github.event.action == 'synchronize' || github.event.action == 'closed')) ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/deploy
        with:
          command: down pr-${{ github.event.pull_request.number }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # A new commit takes the label with the preview: adding it again deploys that commit.
      # (A label removed with this token starts no workflow run.)
      - name: Remove the label
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --remove-label preview
