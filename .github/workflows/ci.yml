name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A new push to a pull request cancels its running CI; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Always the first job: no AI attribution in commits or the pull request.
  no-ai-signs:
    uses: CandleStack-FEI-STU/.github/.github/workflows/no-ai-signs.yml@main
    permissions:
      contents: read

  # Decides which suites run: each only when something it checks changed.
  changes:
    needs: no-ai-signs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked out as its merge commit: the first parent is the base.
          if [[ $EVENT == pull_request ]]; then
            base=HEAD^1
          else
            base=$BEFORE
          fi
          if [[ $base =~ ^0*$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base ($base): running everything."
            changed=$'backend/\ninfra/'
          else
            changed=$(git diff --name-only "$base" HEAD)
          fi
          backend=false
          infra=false
          if grep -qE '^(backend/|docs/openapi\.json$|compose[^/]*\.yaml$|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            backend=true
          fi
          if grep -qE '^(infra/|frontend/|\.github/)' <<<"$changed"; then
            infra=true
          fi
          echo "backend=$backend" | tee -a "$GITHUB_OUTPUT"
          echo "infra=$infra" | tee -a "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: backend/pyproject.toml
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run ty check --output-format=github
      - run: uv run lint-imports

  unit:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: backend/pyproject.toml
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --locked
      # Unit and contract tests (the docs/openapi.json snapshot among them).
      - run: uv run pytest -n auto

  integration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: backend/pyproject.toml
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --locked
      - run: uv run pytest -m integration

  e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      E2E_PORT: 18000
      E2E_BASE_URL: http://127.0.0.1:18000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built here with a layer cache, then started by compose from the loaded image.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: candlestack-backend:e2e-${{ env.E2E_PORT }}
          build-args: APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=backend-e2e
          cache-to: type=gha,mode=max,scope=backend-e2e

      - name: Start the stack
        run: docker compose -f tests/e2e/compose.yaml up -d --wait

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: backend/pyproject.toml
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --locked
      - run: uv run pytest -m e2e

      - name: Logs of the stack
        if: failure()
        run: docker compose -f tests/e2e/compose.yaml logs

      - name: Stop the stack
        if: always()
        run: docker compose -f tests/e2e/compose.yaml down --volumes

  # What only the post-merge deploy would otherwise exercise: the workflows and their scripts,
  # the deploy script the VM runs as a forced command, the edge and tunnel configuration and
  # the images other than the backend's. A broken one on main breaks the next deploy.
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Workflows (actionlint, with shellcheck on their run scripts)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Shell scripts
        run: shellcheck infra/vm/candlestack-deploy infra/vm/*.sh .github/scripts/*.sh

      # With the Caddy image the edge runs.
      - name: Edge Caddyfile
        run: |
          image=$(sed -n 's/^ *image: *//p' infra/edge/compose.yaml)
          docker run --rm -v "$PWD/infra/edge/caddy:/etc/caddy:ro" "$image" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Tunnel ingress rules
        run: |
          docker run --rm -v "$PWD/infra/cloudflared:/etc/cloudflared:ro" \
            cloudflare/cloudflared:2026.9.3 tunnel --config /etc/cloudflared/config.yml ingress validate

      - name: Frontend image and its Caddyfile
        run: |
          docker build --tag frontend-check frontend
          docker run --rm frontend-check caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Server agent image
        run: docker build --tag agent-check infra/agent

  # The one required check besides no-ai-signs: green when every job passed or was skipped.
  ci:
    name: ci
    if: always()
    needs: [no-ai-signs, changes, lint, unit, integration, e2e, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            exit 1
          fi
