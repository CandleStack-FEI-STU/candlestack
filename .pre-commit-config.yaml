# Quick checks on every commit, so the common mistakes never reach CI. Install once per clone:
#   uvx pre-commit install
# CI runs the same hooks on every file (pre-commit run --all-files, the Pre-commit job); a commit
# with --no-verify skips them locally but not there. Types, module boundaries and tests run in CI
# only. ruff comes from backend/uv.lock, the same release CI uses. Update the other pins with:
#   uvx pre-commit autoupdate --freeze
default_install_hook_types: [pre-commit, commit-msg]
# Recorded responses of Binance and Alpaca: kept byte for byte as the sources sent them.
exclude: ^backend/tests/fixtures/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-executables-have-shebangs
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      # The whole working tree, not only the staged changes, so CI's --all-files checks it too.
      # .gitleaks.toml allows the recorded fixtures and the public Access identifiers.
      - id: gitleaks
        entry: gitleaks dir --redact --verbose

  - repo: https://github.com/crate-ci/typos
    rev: 4141ff14cb566df76c473c786332c186a4fd71d1  # frozen: v1.50.3
    hooks:
      - id: typos

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: e8b4e28241a9ae8296ba6e4a491b5da4eda73283  # frozen: 3.11.1
    hooks:
      - id: editorconfig-checker
        alias: ec

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--min-severity=medium]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10  # frozen: v0.23.3
    hooks:
      - id: markdownlint-cli2

  # Every shell script (by extension or shebang): formatted with two-space indents, then linted
  # with the options in .shellcheckrc.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9  # frozen: v3.14.1-1
    hooks:
      - id: shfmt
        args: [--write, --indent=2, --case-indent]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck

  # The Dockerfiles of the backend, the frontend and the server agent.
  - repo: https://github.com/AleksaC/hadolint-py
    rev: 6e7504451511eaeb62a3e7f14d63b0296cbf86eb  # frozen: v2.15.1
    hooks:
      - id: hadolint

  - repo: https://github.com/CandleStack-FEI-STU/.github
    rev: a71b7bcef1ffdfd0c0e4d1b293e12e8850a6fd80
    hooks:
      - id: comments

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run --project backend ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      # The rules of the no-ai-signs check that CI runs on every pull request.
      - id: no-ai-signs
        name: no AI attribution in the commit message
        language: pygrep
        entry: '(?i)co-authored-by:.*(claude|anthropic|copilot|chatgpt|openai|gemini|cursor|codex|devin|aider)|generated (with|by) .*(claude|anthropic|copilot|chatgpt|openai|gemini|cursor|codex|devin|aider|\bai\b)|claude\.ai/code|claude-session|🤖'
        stages: [commit-msg]
