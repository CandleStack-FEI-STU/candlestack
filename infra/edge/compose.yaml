# Edge proxy shared by all environments. Only cloudflared on the host reaches it,
# so it listens on localhost and speaks plain HTTP (TLS ends at Cloudflare).
name: edge

services:
  caddy:
    # A pinned release, updated by Dependabot: "edge" runs "compose up", which pulls and
    # recreates the container only when this reference changes.
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
    networks:
      edge:
        # The server agent checks the previews' health through this proxy (see agent.py).
        aliases:
          - edge-caddy
      edge-preview: {}

networks:
  # prod, stage and the server agent.
  edge:
    name: edge
  # The previews only: they run the code of pull requests, and Docker does not route between
  # two networks, so from here they reach none of the other containers. Its subnet is fixed
  # because the Caddyfile refuses requests from it.
  edge-preview:
    name: edge-preview
    ipam:
      config:
        - subnet: 10.99.0.0/24

volumes:
  caddy_data:
