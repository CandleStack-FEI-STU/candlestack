# Cloudflare Tunnel "candlestack-vm". The VM opens no inbound ports: cloudflared
# connects out to Cloudflare and forwards requests to the VM.
# DNS: app, stage and * (for vm and pr-<N>-preview) are proxied CNAMEs to <tunnel id>.cfargotunnel.com.
tunnel: 8cbd2a1f-f294-4534-bb63-f491bed7a51a
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # Deployments from GitHub Actions (deploy user, key-restricted commands only).
  - hostname: ssh.candlestack.tech
    service: ssh://127.0.0.1:22
  # Everything else goes to the edge Caddy, which routes by hostname.
  - service: http://127.0.0.1:80
