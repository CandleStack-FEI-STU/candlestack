# One environment (prod, stage or pr-<N>) as its own compose project, started by
# infra/vm/candlestack-deploy on the VM, which also exports the backend's Alpaca keys
# (ALPACA_KEY_ID, ALPACA_SECRET_KEY) for this command only:
#   ENV_NAME=stage APP_VERSION=<version> BACKEND_IMAGE=<image@digest> FRONTEND_IMAGE=<image@digest> \
#   REDIS_MAXMEMORY=128mb REDIS_MEM_LIMIT=160m docker compose -p stage -f infra/env/compose.yaml up -d
# On the shared "edge" network the edge Caddy reaches <ENV_NAME>-backend:8000 (/api/*) and
# <ENV_NAME>-frontend:8080 (everything else). Redis is on the environment's own network only.
services:
  backend:
    image: ${BACKEND_IMAGE:?}
    restart: unless-stopped
    environment:
      APP_ENV: ${ENV_NAME:?}
      APP_VERSION: ${APP_VERSION:?}
      REDIS_URL: redis://redis:6379/0
      ALPACA_KEY_ID: ${ALPACA_KEY_ID:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
    # Read by the server agent: ops tells deploys (new version) from redeploys (same version).
    labels:
      candlestack.version: ${APP_VERSION:?}
    mem_limit: 320m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 503 while Redis is unreachable, so the container is unhealthy then too.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      default: {}
      edge:
        aliases:
          - ${ENV_NAME}-backend

  frontend:
    image: ${FRONTEND_IMAGE:?}
    restart: unless-stopped
    environment:
      APP_ENV: ${ENV_NAME:?}
      APP_VERSION: ${APP_VERSION:?}
    labels:
      candlestack.version: ${APP_VERSION:?}
    mem_limit: 32m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        aliases:
          - ${ENV_NAME}-frontend

  # Cache only: no persistence, least recently used keys go first when maxmemory is reached.
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_MAXMEMORY:?}", "--maxmemory-policy", "allkeys-lru"]
    user: redis
    mem_limit: ${REDIS_MEM_LIMIT:?}
    read_only: true
    # Nothing is written to /data; a tmpfs there keeps Docker from leaving an anonymous volume.
    tmpfs:
      - /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

networks:
  edge:
    external: true
